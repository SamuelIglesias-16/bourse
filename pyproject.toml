[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bourse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "selectolax>=0.3",
    "pydantic>=2.0",
    "typer>=0.12",
    "polars>=0.20",
    "rich>=13.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
bourse = "bourse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bourse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
